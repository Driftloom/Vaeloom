[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-agent-policy"
version = "0.1.0"
description = "Declarative policy engine and agent.yaml compiler for Vaeloom agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Vaeloom Engineering", email = "eng@vaeloom.com"},
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "vaeloom-agent-contracts",
    "vaeloom-agent-security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
