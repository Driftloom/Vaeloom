[extend]
useDefault = true

[allowlist]
description = "Global allowlist for documentation, test fixtures, synthetic envs, and mocks"
paths = [
  '''apps/api/tests/.*''',
  '''sdk/.*/tests/.*''',
  '''sdk/.*/__tests__/.*''',
  '''services/.*''',
  '''testing/.*''',
  '''specs/.*''',
  '''docs/.*''',
  '''evidence/.*''',
  '''apps/web/src/app/workspace/\[workspaceId\]/developer/page\.tsx''',
  '''apps/web/playwright\.config\.ts''',
  '''\.github/workflows/.*''',
  '''\.env\..*''',
  '''\.env\.example''',
  '''README\.md''',
  '''apps/api/README\.md''',
  '''AGENTS\.md'''
]
stopwords = [
  "ci-migration-chain-secret-at-least-32-chars",
  "Y2ktbWlncmF0aW9uLWNoYWluLWVuY3J5cHRpb24ta2V5MDA=",
  "ci-test-encryption-key-must-be-at-least-32-chars!!",
  "ci-test-secret-not-for-production",
  "dev-insecure-jwt-secret-key-change-in-production-min-32-chars"
]
