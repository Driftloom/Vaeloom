name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['bug', 'fix']
  - title: '🔒 Security'
    labels: ['security']
  - title: '🧹 Maintenance'
    labels: ['chore', 'dependencies']
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
version-resolver:
  major:
    labels: ['major']
  minor:
    labels: ['minor', 'feature']
  patch:
    labels: ['patch', 'fix', 'security', 'chore', 'dependencies']
  default: patch
template: |
  ## Changes
  $CHANGES
