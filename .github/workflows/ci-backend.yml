name: API CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-must-be-at-least-32-chars!!
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Verify Architecture & Zero-Bypass Boundaries
        run: python ../../scripts/verify_architecture.py
      - name: Platform Packages & Agents Unit Tests
        run: |
          export PYTHONPATH="packages/agent-contracts/src:packages/agent-security/src:packages/agent-policy/src:packages/agent-common/src:packages/agent-memory/src:packages/agent-tools/src:packages/connectors/src:packages/domain/src:packages/agent-delegation/src:packages/agent-observability/src:packages/agent-evals/src:runtimes/agent-sdk/src:runtimes/messages-api-worker/src:."
          python -m pytest ../../packages/ ../../runtimes/ -q
      - name: Temporal dry-run check
        run: python -m api.temporal.worker --dry-run
      - name: Temporal workflow tests (serial — WorkflowEnvironment time-skipping not xdist-safe)
        run: python -m pytest tests/temporal -q -o addopts="" --timeout=120
      - run: python -m pytest tests/ -q --cov=src/api/ --cov-report=xml --cov-report=term --ignore=tests/temporal
