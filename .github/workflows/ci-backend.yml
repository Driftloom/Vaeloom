name: API CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-test-secret-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-must-be-at-least-32-chars!!
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Verify Architecture & Zero-Bypass Boundaries
        run: python ../../scripts/verify_architecture.py
      - name: Platform Packages & Agents Unit Tests
        run: |
          PYTHONPATH="$(for d in $GITHUB_WORKSPACE/packages/*/src $GITHUB_WORKSPACE/runtimes/*/src; do [ -d "$d" ] && printf '%s:' "$d"; done)."
          export PYTHONPATH
          python -m pytest ../../packages/ ../../runtimes/ -q
      - name: Temporal dry-run check
        run: python -m api.temporal.worker --dry-run
      - name: Verify OpenAPI Spec Sync
        run: python ../../scripts/gen_openapi.py && git diff --exit-code ../../specs/api/openapi.yaml ../../docs/backend/openapi.yaml
      - name: Temporal workflow tests (serial — WorkflowEnvironment time-skipping not xdist-safe)
        run: python -m pytest tests/temporal -q -o addopts="" --timeout=120
      - name: Agent Hierarchy & Gaps Suite (standalone)
        run: python -m pytest tests/test_agent_to_agent_hierarchy.py tests/test_agentic_gaps_closure.py -q -o addopts=""
      - name: Agent Evaluation Golden Suite (standalone)
        run: python -m pytest tests/test_agent_eval_execution.py -q -o addopts=""
      - name: Core API Test Suite
        run: python -m pytest tests/ -q -o addopts="-n 2 --dist loadfile" --timeout=180 --timeout-method=thread --cov=src/api/ --cov-report=xml --cov-report=term --ignore=tests/temporal --ignore=tests/integration --ignore=tests/adversarial --ignore=tests/test_agent_eval_execution.py --ignore=tests/test_agent_to_agent_hierarchy.py --ignore=tests/test_agentic_gaps_closure.py
