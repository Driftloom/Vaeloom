name: API CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      JWT_SECRET: ci-test-secret-not-for-production
      ENCRYPTION_KEY: ci-test-encryption-key-must-be-at-least-32-chars!!
      # pytest's terminal writer block-buffers when stdout is a pipe, so
      # without this a crashed run hides the progress that preceded it.
      PYTHONUNBUFFERED: "1"
      # Native crashes (SIGSEGV/SIGABRT) dump their stacks to stderr instead
      # of dying silently.
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Install Playwright Chromium
        # tests/test_overleaf_integration.py::test_latex_compiler_fallback
        # exercises the HTML->PDF fallback, which drives Chromium. Without the
        # browser it failed with PlaywrightUnavailableError on every run.
        run: python -m playwright install --with-deps chromium
      - name: Verify Architecture & Zero-Bypass Boundaries
        run: python ../../scripts/verify_architecture.py
      - name: Platform Packages & Agents Unit Tests
        run: |
          PYTHONPATH="$(for d in $GITHUB_WORKSPACE/packages/*/src $GITHUB_WORKSPACE/runtimes/*/src; do [ -d "$d" ] && printf '%s:' "$d"; done)."
          export PYTHONPATH
          python -m pytest ../../packages/ ../../runtimes/ -q
      - name: Temporal dry-run check
        run: python -m api.temporal.worker --dry-run
      - name: Verify OpenAPI Spec Sync
        run: python ../../scripts/gen_openapi.py && git diff --exit-code ../../specs/api/openapi.yaml ../../docs/backend/openapi.yaml
      - name: Verify generated memory-type union
        # The union is generated from CAREER_TYPES and the contract is byte-exact,
        # so `--check` compares bytes and exits non-zero on any drift -- reordering
        # and reformatting included, since members are never sorted.
        #
        # Why a step and not just the existing test: the drift IS currently caught
        # by pytest, but only incidentally, because
        # test_memory_type_packs.py::test_generator_check_mode_passes_on_the_
        # committed_file_and_fails_on_drift shells out to `--check` against the real
        # artefact. That makes the guard's existence depend on an unrelated test's
        # internals: it disappears if that test is deselected, skipped, or sharded
        # out, and its failure message names a test rather than the file that is
        # stale. This step is the gate the spec asked for, and it prints the diff
        # an author needs to regenerate.
        run: python ../../scripts/gen_memory_type_union.py --check
      - name: Temporal workflow tests (serial — WorkflowEnvironment time-skipping not xdist-safe)
        run: python -m pytest tests/temporal -q -o addopts="" --timeout=120
      - name: Agent Hierarchy & Gaps Suite (standalone)
        run: python -m pytest tests/test_agent_to_agent_hierarchy.py tests/test_agentic_gaps_closure.py -q -o addopts=""
      - name: Agent Evaluation Golden Suite (standalone)
        run: python -m pytest tests/test_agent_eval_execution.py -q -o addopts=""
      - name: Core API Test Suite
        # --max-worker-restart: a worker that dies (OOM kill, or pytest-timeout's
        # thread method, which calls os._exit and takes the worker process with
        # it) otherwise takes its in-flight tests down with it. xdist restarts
        # the worker and re-schedules the lost tests.
        #
        # No -q: xdist gates report_line() on verbose >= 0, so -q silently
        # dropped "replacing crashed worker" and "maximum crashed workers
        # reached" -- the only lines that explained the worker deaths.
        #
        # --ci-watchdog-timeout: dsession.loop_once() has no liveness deadline.
        # When a worker is stuck below the Python layer, triggershutdown() can
        # never finish and the job burns until timeout-minutes. 240s is above the
        # per-test 180s timeout, so real progress never trips it. The job cap is
        # 55 minutes: setup ~3 min plus the slowest observed suite (36m40s) lands
        # near 40 min, leaving ~15 min to upload evidence before a legitimate
        # timeout. 300s fired only 2s before the old 45-minute cap on run
        # 43391392028. A genuine stall exits 66 with a dump naming the last test
        # the controller saw start.
        #
        # --cov-fail-under=0: a worker killed mid-run is dropped from
        # pytest-cov, so the in-step gate reported "coverage 25% < 80%" and
        # masked the crash. Tests decide tests; the separate step below decides
        # coverage.
        #
        # CI_INTEGRITY_DIR is step-scoped so the evidence artifact contains
        # only this suite, not the standalone suites above. It must not be a
        # dot-directory: upload-artifact skips hidden files by default, which is
        # why the first instrumented run uploaded nothing.
        env:
          CI_INTEGRITY_DIR: ${{ github.workspace }}/ci-integrity
        run: |
          mkdir -p "$CI_INTEGRITY_DIR"
          python -m pytest tests/ \
            -o addopts="-n 2 --dist loadfile --max-worker-restart=4" \
            --timeout=180 --timeout-method=thread \
            --ci-watchdog-timeout=240 \
            --maxfail=25 -rf --tb=short \
            --cov=src/api/ --cov-report=xml --cov-report=term --cov-fail-under=0 \
            --junitxml="$CI_INTEGRITY_DIR/junit.xml" \
            --ignore=tests/temporal \
            --ignore=tests/integration \
            --ignore=tests/adversarial \
            --ignore=tests/test_agent_eval_execution.py \
            --ignore=tests/test_agent_to_agent_hierarchy.py \
            --ignore=tests/test_agentic_gaps_closure.py

      - name: Coverage floor
        # Runs only if the suite passed: a lost worker must surface as a test
        # crash with a stack, never as a coverage percentage.
        run: python -m coverage report --fail-under=80

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-ci-evidence
          path: |
            ci-integrity/
            apps/api/coverage.xml
          if-no-files-found: warn
          retention-days: 14
