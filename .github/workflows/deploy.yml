name: Deploy

# NOTE: no `push` trigger on purpose.
# The repository default branch is `master`, not `main`, so the previous
# `push: branches: [main]` trigger could never fire.
# It is intentionally NOT re-pointed to `master` yet: this pipeline has
# unresolved blockers that would make an unattended deploy unsafe --
#   1. `build-and-push` has no `needs:` (untested code would be built),
#   2. 19 of 23 k8s Deployments reference images that are never built,
#      so `kubectl wait` cannot succeed,
#   3. the API Deployment is unstartable (port 4000 vs 8000, and
#      `validate_settings()` fails against its own manifest env),
#   4. no post-deploy smoke test; the load-test "gate" is an `echo`,
#   5. rollback is a bare `kubectl rollout undo` with no re-verification.
# Re-enable unattended deploy only after WAVE 8 (ENTERPRISE-PRODUCTION-
# READINESS-PLAN.md) closes items W8.5-W8.15.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: environment
        required: true
        default: staging

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: vaeloom-${{ github.event.inputs.environment || 'staging' }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.0
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'staging' }}
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/terraform/tfplan

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service:
          - web
          - api
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Determine build context
        id: build-context
        run: |
          if [ -d "apps/${{ matrix.service }}/Dockerfile" ] || [ -f "apps/${{ matrix.service }}/Dockerfile" ]; then
            echo "context=apps/${{ matrix.service }}" >> $GITHUB_OUTPUT
            echo "dockerfile=apps/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
            echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.build-context.outputs.context }}
          file: ${{ steps.build-context.outputs.dockerfile }}
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/vaeloom/${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/vaeloom/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.2.4'
      - name: Sign container image
        run: |
          cosign sign --yes \
            --key awskms:///${{ secrets.AWS_KMS_KEY_ID }} \
            ${{ secrets.ECR_REGISTRY }}/vaeloom/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: false
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.ECR_REGISTRY }}/vaeloom/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
      - name: Attach SBOM attestation
        run: |
          cosign attach attestation \
            --key awskms:///${{ secrets.AWS_KMS_KEY_ID }} \
            --type spdx \
            --predicate sbom-${{ matrix.service }}.spdx.json \
            ${{ secrets.ECR_REGISTRY }}/vaeloom/${{ matrix.service }}:${{ github.sha }}

  load-test-gate:
    name: Load Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v7

      # Previously this job started nothing and left BASE_URL at its
      # localhost default, so k6 ran against a closed port and this gate could
      # only ever block every deploy. The `Check thresholds` step below it was
      # an `echo`, which reads as verification but asserts nothing -- and
      # grafana/k6-action already fails the step when a threshold breaches, so
      # the echo added no signal either way.
      #
      # Raising the API is now part of the gate. If the service cannot start,
      # this job fails loudly instead of measuring nothing.
      - name: Start datastores
        run: |
          # Only postgres and redis. The `api` service is deliberately not used:
          # its entrypoint is `alembic upgrade head && uvicorn ...`, and the
          # migration chain grants to and creates policies `TO` the Supabase
          # roles `postgres`, `authenticated` and `service_role`. The compose
          # postgres image is created with POSTGRES_USER=vaeloom, so none of
          # those roles exist and alembic aborts on `role "service_role" does
          # not exist`. Observed locally as a 121-restart crash loop that never
          # bound a port. The roles are provisioned explicitly below instead.
          docker compose -f docker-compose.yml up -d postgres redis

      - name: Provision Supabase-compatible roles
        run: |
          # Mirrors scripts/verify_pg_migrations.py:NONLOGIN_ROLES. They exist
          # only so `GRANT ... TO` and `CREATE POLICY ... TO` resolve; on
          # Supabase they are not login roles either.
          docker compose -f docker-compose.yml exec -T postgres psql -U vaeloom -d vaeloom -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE postgres LOGIN SUPERUSER;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL

      - name: Run migrations
        env:
          VAELOOM_TARGET_URL: postgresql+asyncpg://vaeloom:vaeloom_dev@localhost:5432/vaeloom
          DATABASE__URL: postgresql+asyncpg://vaeloom:vaeloom_dev@localhost:5432/vaeloom
          JWT_SECRET: ci-loadtest-jwt-secret-32-chars-long!!
          ENCRYPTION_KEY: ci-loadtest-encryption-key-for-loadtest-40chars!!
          OTEL_SDK_DISABLED: 'true'
        run: |
          # Run from apps/api: alembic resolves script_location relative to the
          # working directory, and the repo has no alembic.ini at the root, so
          # running from the root fails with "No 'script_location' key found in
          # configuration".
          #
          # VAELOOM_TARGET_URL is set deliberately. get_database_url() prefers
          # it over DATABASE__URL, and a checked-in `.env` carries a remote
          # Supabase URL that the Remote-DDL guard would otherwise refuse --
          # correctly. This pins the target to the container.
          cd apps/api
          uv run python -m alembic upgrade head

      - name: Start API under test
        env:
          VAELOOM_TARGET_URL: postgresql+asyncpg://vaeloom:vaeloom_dev@localhost:5432/vaeloom
          DATABASE__URL: postgresql+asyncpg://vaeloom:vaeloom_dev@localhost:5432/vaeloom
          REDIS__URL: redis://localhost:6379/0
          RATE_LIMIT_REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-loadtest-jwt-secret-32-chars-long!!
          ENCRYPTION_KEY: ci-loadtest-encryption-key-for-loadtest-40chars!!
          ALLOWED_ORIGINS: '["https://app.vaeloom.app"]'
          SERVICE_ENVIRONMENT: ci
          OTEL_SDK_DISABLED: 'true'
          TEMPORAL_ENABLED: 'false'
        run: |
          # `local` would turn on SQL echo (database.py:22
          # `settings.service_environment == "local"`), which logs every query
          # and inflates the very latency numbers this gate exists to measure.
          cd apps/api
          nohup uv run python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/api.pid"

      - name: Wait for API readiness
        run: |
          # /health/ready returns HTTP 200 even when a dependency is down and
          # the body reads "status": "degraded", so a bare HTTP probe would
          # happily pass an API with no database. Assert the body instead.
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8000/health/ready 2>/dev/null || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "API ready after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::API never reported status=ok within 600s"
          tail -100 "$RUNNER_TEMP/api.log" || true
          exit 1

      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        env:
          BASE_URL: http://127.0.0.1:8000
        with:
          filename: testing/performance/k6-script.js
          flags: --vus 10 --duration 30s

      # Thresholds live in the k6 script itself and grafana/k6-action already
      # fails the step when one breaches, so there is no separate assertion
      # step to add here. The previous `echo "Load test gate passed"` was the
      # only thing between a real measurement and a green checkmark.
      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs api | tail -200

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [terraform-plan, build-and-push, load-test-gate]
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: Deploy with kustomize
        run: |
          kubectl apply -k infra/kubernetes/base
      - name: Verify deployment
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment -n vaeloom -l app.kubernetes.io/part-of=vaeloom
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment -n vaeloom -l app.kubernetes.io/part-of=vaeloom

  slack-notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: always()
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Vaeloom deploy ${{ job.status == 'success' && 'succeeded' || 'failed' }} to ${{ github.event.inputs.environment || 'staging' }} (${{ github.sha }})",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Vaeloom deploy *${{ job.status == 'success' && 'succeeded' || 'failed' }}}* to `${{ github.event.inputs.environment || 'staging' }}`\nCommit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
