name: Frontend CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - name: Jest unit/component tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare API database (fresh)
        working-directory: apps/api
        run: uv sync --frozen --extra dev || uv sync --extra dev
      # webServer entries in playwright.config.ts start both the real API
      # (SQLite + mock LLM key, e2e user auto-seeded by api-launcher.py) and
      # the Next.js dev server.
      - name: Run E2E suite (real backend, axe, responsive — gating)
        run: pnpm exec playwright test --grep-invert "visual baselines"
      # Visual regression stays advisory: `toHaveScreenshot` compares per-OS, and
      # only -win32 baselines are committed, so a hard compare against ubuntu
      # output has nothing to match and would fail on font rasterization alone.
      # What IS gated lives in the blocking run above: landing.spec.ts's a11y tests
      # now assert the requested theme actually applied (html class + painted body
      # background), which is the check the old pixel-only suite was missing - the
      # committed "dark" baselines were light renders (top-band luminance 170 vs
      # 73 for a correct dark capture) and still passed.
      - name: Visual baselines (advisory, refresh + upload)
        run: pnpm exec playwright test --grep "visual baselines" --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # The step above runs landing.spec.ts, so this must be the landing
          # snapshot dir. It previously pointed at quality.spec.ts-snapshots,
          # which meant the refreshed landing baselines were never published.
          name: visual-baselines-linux
          path: apps/web/e2e/landing.spec.ts-snapshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
