name: Frontend CI
on:
  push:
  pull_request:
  # Manual trigger exists solely to run the `visual-baseline-refresh` job after a
  # maintainer reviews an intentional visual change. The e2e GATE and build/unit
  # jobs are skipped for this event, so dispatch cannot bypass the checks a PR
  # still has to pass.
  workflow_dispatch:

jobs:
  build:
    # Skip on manual dispatch — a dispatch exists only to refresh baselines, so it
    # must not spend CI minutes re-running the standard checks.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  unit:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - name: Jest unit/component tests
        run: pnpm test

  e2e:
    if: github.event_name != 'workflow_dispatch'
    # Pinned, not `ubuntu-latest`: `toHaveScreenshot` rasterizes text with the
    # runner's font stack, and a moving image silently changes glyph pixels, which
    # would fail the visual GATE below for reasons unrelated to the app. The
    # baseline-refresh job must use this exact image so generation and
    # comparison never drift.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare API database (fresh)
        working-directory: apps/api
        run: uv sync --frozen --extra dev || uv sync --extra dev
      # webServer entries in playwright.config.ts start both the real API
      # (SQLite + mock LLM key, e2e user auto-seeded by api-launcher.py) and
      # the Next.js dev server.
      - name: Run E2E suite (real backend, axe, responsive — gating)
        run: pnpm exec playwright test --grep-invert "visual baselines"
      # Visual regression is now a GATE (plan D-R2), not an advisory refresh.
      #
      # The old run did `--grep "visual baselines" --update-snapshots`, which
      # rewrites every baseline and exits 0 no matter what the pixels do, so a real
      # visual regression could never fail CI. This step instead COMPARES against
      # the committed `-linux` baseline for the pinned runner above and FAILS on any
      # unapproved diff. Font rasterization is deterministic because both this job
      # and the refresh job below pin `ubuntu-24.04`.
      #
      # Theme correctness stays gated in the blocking run above: landing.spec.ts's
      # a11y tests assert the requested theme actually applied (html class + painted
      # body background) — the check the old pixel-only suite was missing (committed
      # "dark" baselines were light renders and still passed).
      #
      # BOOTSTRAP: only `-win32` baselines are committed today, so the first run of
      # this compare on ubuntu fails with "snapshot missing" until a maintainer runs
      # the `visual-baseline-refresh` workflow once to seed the `-linux` set. From
      # then on a PR passes only by matching committed baselines; landing an
      # intentional visual change requires a maintainer to re-run that refresh.
      - name: Visual regression (GATE — fails on unapproved diff)
        run: pnpm exec playwright test --grep "visual baselines"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # The failing actual + diff images, so a reviewer can see exactly what
          # moved without re-running the job. `toHaveScreenshot` writes these under
          # test-results/ and the `-snapshots/` dirs on a compare failure.
          name: visual-regression-artifacts
          path: apps/web/test-results/
          retention-days: 14

  # Baseline maintenance is a deliberate, human-approved action — never part of a
  # PR's required checks (a PR must only be able to pass or fail against the
  # baselines, never move them). Trigger it manually after reviewing an intentional
  # visual change; it regenerates the `-linux` set and commits them back so the
  # GATE above compares against the newly blessed pixels. Uses the identical pinned
  # image as the e2e job so generation and comparison cannot drift.
  visual-baseline-refresh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Prepare API database (fresh)
        working-directory: apps/api
        run: uv sync --frozen --extra dev || uv sync --extra dev
      - name: Regenerate -linux visual baselines
        run: pnpm exec playwright test --grep "visual baselines" --update-snapshots
      - name: Commit refreshed baselines
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "Bappadala Rohith Kumar Naidu"
          git config user.email "198095685+rohitkumarnaidu@users.noreply.github.com"
          # Scope the add to ONLY the linux baseline PNGs — the bot must never
          # commit source or anything else that changed during the run.
          git add apps/web/e2e/landing.spec.ts-snapshots/*-linux.png \
                  apps/web/e2e/quality.spec.ts-snapshots/*-linux.png
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(e2e): refresh -linux visual baselines [skip ci]"
            git push
          fi
