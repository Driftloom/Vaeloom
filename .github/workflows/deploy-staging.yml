name: Deploy Staging

# Auto-deploys the web tier after a successful "Docker Build" run on master.
# Gated behind the `staging` GitHub environment, which MUST have required
# reviewers + branch protection configured in repo Settings → Environments;
# without that, this workflow would deploy any master merge unattended.
on:
  workflow_run:
    workflows: [Docker Build]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: vaeloom-staging
  NAMESPACE: vaeloom

jobs:
  deploy:
    name: Deploy web to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the default branch's successful builds deploy.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7

      - name: Check deployment credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_DEPLOY_ROLE_ARN is not configured; skipping staging deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        if: steps.check-creds.outputs.configured == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy web image
        if: steps.check-creds.outputs.configured == 'true'
        # Tag with the exact commit "Docker Build" produced the image for
        # (docker-build.yml tags with github.sha == this run's head_sha),
        # not this workflow's own github.sha.
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.ECR_REGISTRY }}/vaeloom-web:${{ github.event.workflow_run.head_sha }}"
          kubectl set image deployment/vaeloom-web web="$IMAGE" -n "$NAMESPACE"
          kubectl rollout status deployment/vaeloom-web -n "$NAMESPACE" --timeout=180s

      - name: Post-deploy smoke check
        if: steps.check-creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n "$NAMESPACE" -l app.kubernetes.io/name=web \
            --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "$NAMESPACE" "$POD" -- \
            wget -qO- "http://localhost:3000/api/health" | grep -qi 'ok\|healthy\|status'

      - name: Rollback on failure
        if: failure() && steps.check-creds.outputs.configured == 'true'
        run: |
          kubectl rollout undo deployment/vaeloom-web -n "$NAMESPACE"
          kubectl rollout status deployment/vaeloom-web -n "$NAMESPACE" --timeout=120s
