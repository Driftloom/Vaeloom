name: Migration Chain (PostgreSQL)

# The SQLite suite cannot see this class of defect at all: it has no row-level
# security, no pg_policies catalogue, and it does not enforce foreign key column
# types. Every migration problem found in the 2026-09 audit — an un-appliable
# FK in 0057, the missing pgvector extension, two tables no migration ever
# created, and `document_actions` left with no RLS at all — was invisible until
# the chain was run against a real PostgreSQL server.
#
# So this workflow runs `alembic upgrade head` against a throwaway PostgreSQL and
# then asserts the end state, rather than trusting that the migrations "ran".

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/api/alembic/**'
      - 'apps/api/src/api/models/**'
      - 'apps/api/tests/test_migration*'
      - 'apps/api/tests/test_verify_pg_migrations_script.py'
      - 'apps/api/tests/test_run_pg_verification_wrapper.py'
      # The other two live-PostgreSQL suites the harness runs. Without these the
      # filter covered only test_migration*, so a change to either of these alone
      # would never re-run this job -- and these hold the 10 tests that were
      # skipped for want of a database before scripts/verify_pg_migrations.py
      # existed. A gate that does not trigger on the tests it is a gate for is not
      # a gate.
      - 'apps/api/tests/test_rls_live_pg.py'
      - 'apps/api/tests/test_ranking_weights_rls.py'
      - 'apps/api/src/api/main.py'
      - 'apps/api/src/api/config.py'
      - 'scripts/verify_pg_migrations.py'
      - 'scripts/run_pg_verification.ps1'
      - '.github/workflows/migration-chain.yml'
  pull_request:
    paths:
      - 'apps/api/alembic/**'
      - 'apps/api/src/api/models/**'
      - 'apps/api/tests/test_migration*'
      - 'apps/api/tests/test_verify_pg_migrations_script.py'
      - 'apps/api/tests/test_run_pg_verification_wrapper.py'
      - 'apps/api/tests/test_rls_live_pg.py'
      - 'apps/api/tests/test_ranking_weights_rls.py'
      - 'apps/api/src/api/main.py'
      - 'apps/api/src/api/config.py'
      - 'scripts/verify_pg_migrations.py'
      - 'scripts/run_pg_verification.ps1'
      - '.github/workflows/migration-chain.yml'
  workflow_dispatch:

concurrency:
  group: migration-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # pgvector, not plain postgres: the chain uses the `vector` type for
        # embedding columns. 0001 now creates the extension itself, but the
        # server still has to have the extension files available.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaeloom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vaeloom_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vaeloom_test
      VAELOOM_TARGET_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vaeloom_test
      VAELOOM_TEST_PG_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vaeloom_test
      JWT_SECRET: ci-migration-chain-secret-at-least-32-chars
      ENCRYPTION_KEY: Y2ktbWlncmF0aW9uLWNoYWluLWVuY3J5cHRpb24ta2V5MDA=
      INFISICAL_ENABLED: 'false'
      SERVICE_ENVIRONMENT: local
      OTEL_SDK_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-extras

      - name: Run PostgreSQL migration verification harness (9-step canonical suite)
        # Drives the canonical scripts/verify_pg_migrations.py against the service container.
        # Exercises all 9 steps: role bootstrapping, upgrade from empty, live suites (4 files),
        # rollback probe seeding, downgrade rejection validation (constraint + value),
        # probe removal and clean downgrade, re-upgrade to head, and post-roundtrip invariants.
        run: uv run --project apps/api python scripts/verify_pg_migrations.py --pg-url postgresql://postgres:postgres@localhost:5432/vaeloom_test

      - name: Assert round trip database reached head
        run: |
          version=$(psql -U postgres -d vaeloom_test -tAc "SELECT version_num FROM alembic_version;")
          echo "alembic_version = $version"
          test -n "$version" || { echo "::error::alembic_version is empty"; exit 1; }

          # Verify active career pack after round trip
          seeded=$(psql -U postgres -d vaeloom_test -tAc "SELECT types::text FROM memory_type_packs WHERE slug='career' AND is_active;")
          test -n "$seeded" || { echo "::error::no active career pack after the round trip"; exit 1; }
          echo "seeded career pack = $seeded"

      - name: Upload migration log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-log
          path: |
            apps/api/.pytest_cache/
          retention-days: 7
