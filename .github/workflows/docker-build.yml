name: Docker Build
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # apps/web/Dockerfile COPYs root workspace files (pnpm-lock.yaml,
          # pnpm-workspace.yaml, package.json, packages/*), so it requires the
          # repository root as its build context. Passing ./apps/web made the
          # build fail at `COPY pnpm-lock.yaml`.
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
          # apps/api/Dockerfile is self-contained (pyproject.toml, src/,
          # alembic/ all live under apps/api) and COPYs paths relative to
          # apps/api, so it must keep that context.
          - service: api
            context: ./apps/api
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: ${{ secrets.ECR_REGISTRY != '' }}
        with:
          registry: ${{ secrets.ECR_REGISTRY }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ secrets.ECR_REGISTRY != '' }}
          tags: ${{ secrets.ECR_REGISTRY != '' && format('{0}/vaeloom-{1}:{2}', secrets.ECR_REGISTRY, matrix.service, github.sha) || format('vaeloom/{0}:{1}', matrix.service, github.sha) }}
