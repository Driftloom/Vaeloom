[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-agent-sdk"
version = "0.1.0"
description = "Clean Python SDK for interacting with Vaeloom agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "vaeloom-agent-contracts",
]

[tool.setuptools.packages.find]
where = ["src"]
