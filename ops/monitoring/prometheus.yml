global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "vaeloom-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: backend
          environment: production

  - job_name: "redis-exporter"
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis
          environment: production

  - job_name: "postgres-exporter"
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
          environment: production

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: node
          environment: production
