apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaeloom
resources:
  - ../../base
  - hpa.yaml
patches:
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: info
      - op: add
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: "500m"
          memory: "1Gi"
  # Temporal server is stateful singleton (Recreate) — must stay 1, not 3
  - target:
      kind: Deployment
      name: vaeloom-temporal
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
