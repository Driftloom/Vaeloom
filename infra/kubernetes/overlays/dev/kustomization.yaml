apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaeloom
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: debug
  # CONT-P16: broken configMapGenerator merge replaced with a strategic patch
  # (same intent: dev LOG_LEVEL=debug, API_RATE_LIMIT=200).
  - target:
      kind: ConfigMap
      name: vaeloom-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
      - op: replace
        path: /data/API_RATE_LIMIT
        value: "200"
