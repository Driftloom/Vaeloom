apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaeloom
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
# CONT-P16: removed dead configMapGenerator merge (LOG_LEVEL=info already the
# base value in base/infra/configmap.yaml; the merge block broke the build).
