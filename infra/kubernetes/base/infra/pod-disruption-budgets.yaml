apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaeloom-api-pdb
  namespace: vaeloom
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaeloom-web-pdb
  namespace: vaeloom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaeloom-queue-worker-pdb
  namespace: vaeloom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: queue-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vaeloom-temporal-pdb
  namespace: vaeloom
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
