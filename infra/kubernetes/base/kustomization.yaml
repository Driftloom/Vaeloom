apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vaeloom
commonLabels:
  app.kubernetes.io/part-of: vaeloom
  app.kubernetes.io/managed-by: kustomize
resources:
  - vaeloom-namespace.yaml
  # Active operational services (Modular Monolith)
  - ./apps/web/deployment.yaml
  - ./apps/web/service.yaml
  - ./apps/api/deployment.yaml
  - ./apps/api/service.yaml
  - ./apps/queue-worker/deployment.yaml
  - ./apps/temporal/deployment.yaml
  - ./apps/temporal/service.yaml
  # Cluster infrastructure & policies
  - ./infra/network-policies.yaml
  - ./infra/pod-disruption-budgets.yaml
  - ./infra/resource-quotas.yaml
  - ./infra/service-accounts.yaml
  - ./infra/configmap.yaml
# NOTE (CONT-P16): configMapGenerator merge removed — ./infra/configmap.yaml
# is the single source of truth (already carries NODE_ENV/LOG_LEVEL plus full
# rate-limit/temporal/langgraph keys). Per-env overrides belong in overlays/ patches.
# NOTE: The 19 target-state microservice contracts (ai-service, auth-service, etc.)
# are preserved under ./apps/ for Phase 3 decomposition specifications.
