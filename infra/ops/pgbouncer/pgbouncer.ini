[databases]
vaeloom = host=localhost port=5432 dbname=vaeloom

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3.0
max_db_connections = 100
max_user_connections = 100

server_idle_timeout = 300
server_lifetime = 3600
server_connect_timeout = 10
server_login_retry = 3
query_timeout = 30
query_wait_timeout = 120
client_idle_timeout = 600
client_login_timeout = 60

pkt_buf = 4096
max_packet_size = 67108864
listen_backlog = 128
sbuf_loopcnt = 5
suspend_timeout = 10
tcp_defer_accept = 0
tcp_keepalive = 1
tcp_keepcnt = 9
tcp_keepidle = 3600
tcp_keepintvl = 75
dns_max_ttl = 15
dns_nxdomain_ttl = 15
