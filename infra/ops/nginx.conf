# ─── Vaeloom Production Nginx Configuration ──────────────────────────────
# Expected SSL certificates at /etc/ssl/vaeloom/

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ──────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time upstream_rt=$upstream_response_time';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  # ─── Performance ──────────────────────────────────────────────────────
  sendfile       on;
  tcp_nopush     on;
  tcp_nodelay    on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  reset_timedout_connection on;
  client_body_timeout   30;
  client_header_timeout 30;
  send_timeout          30;

  # ─── Rate Limiting ──────────────────────────────────────────────────
  # 10 requests per second per IP, burst of 20
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
  limit_conn conn_limit 20;

  # ─── Upload Size ────────────────────────────────────────────────────
  client_max_body_size 50M;
  client_body_buffer_size 128k;

  # ─── Gzip Compression ──────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/x-javascript
    image/svg+xml
    image/x-icon
    font/woff
    font/woff2;

  # ─── SSL ───────────────────────────────────────────────────────────
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_buffer_size 4k;
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 1.1.1.1 valid=300s;
  resolver_timeout 5s;

  # ─── Security Headers (default) ────────────────────────────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "0" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # ─── Upstream Definitions ────────────────────────────────────────────
  upstream web_upstream {
    server web:3000;
    keepalive 64;
  }

  upstream backend_upstream {
    server backend:8000;
    keepalive 64;
  }

  # ─── HTTP → HTTPS Redirect ───────────────────────────────────────────
  server {
    listen 80 default_server;
    server_name vaeloom.app api.vaeloom.app;

    location /.well-known/acme-challenge/ {
      root /var/www/public;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── Main Site (vaeloom.app) ────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name vaeloom.app;

    # SSL
    ssl_certificate     /etc/ssl/vaeloom/fullchain.pem;
    ssl_certificate_key /etc/ssl/vaeloom/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP
    set $csp_base "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.vaeloom.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp_base always;

    # Health check passthrough (no rate limit)
    location /health {
      access_log off;
      return 200 "OK";
    }

    # Static assets (cached)
    location /_next/static {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    location /static {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Favicon / robots
    location = /favicon.ico {
      proxy_pass http://web_upstream;
      access_log off;
      expires 30d;
    }
    location = /robots.txt {
      proxy_pass http://web_upstream;
      access_log off;
      expires 1d;
    }

    # Everything else → web (with rate limit)
    location / {
      limit_req zone=web_limit burst=20 nodelay;
      limit_conn conn_limit 20;

      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }

  # ─── API (api.vaeloom.app) ──────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.vaeloom.app;

    # SSL
    ssl_certificate     /etc/ssl/vaeloom/fullchain.pem;
    ssl_certificate_key /etc/ssl/vaeloom/privkey.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP (API - stricter, no scripts or styles)
    add_header Content-Security-Policy "default-src 'none'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Health check (no rate limit)
    location /api/v1/health {
      access_log off;
      proxy_pass http://backend_upstream/api/v1/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Metrics (internal only)
    location /metrics {
      access_log off;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      deny all;
      proxy_pass http://backend_upstream/metrics;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # API routes (rate limited)
    location / {
      limit_req zone=api_limit burst=20 nodelay;
      limit_conn conn_limit 20;

      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }
  }
}
