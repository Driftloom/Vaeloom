groups:
  - name: vaeloom-service-health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Service {{ $labels.service }} is down'
          description: '{{ $labels.service }} has been unreachable for more than 5 minutes on {{ $labels.instance }}.'
          runbook_url: 'https://vaeloom.dev/runbooks/service-down'

      - alert: HighErrorRate
        expr: |
          (
            rate(http_requests_total{status=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'High error rate on {{ $labels.service }}'
          description: 'Error rate is {{ $value | humanizePercentage }} on {{ $labels.service }} (threshold: 5%).'
          runbook_url: 'https://vaeloom.dev/runbooks/high-error-rate'

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'High p99 latency on {{ $labels.service }}'
          description: 'p99 latency is {{ $value }}s on {{ $labels.service }} (threshold: 5s).'
          runbook_url: 'https://vaeloom.dev/runbooks/high-latency'

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High p95 latency on {{ $labels.service }}'
          description: 'p95 latency is {{ $value }}s on {{ $labels.service }} (threshold: 2s).'

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Low disk space on {{ $labels.instance }}'
          description: 'Disk space is {{ $value | humanizePercentage }} available on {{ $labels.device }} (threshold: 10%).'
          runbook_url: 'https://vaeloom.dev/runbooks/low-disk-space'

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High memory usage on {{ $labels.instance }}'
          description: 'Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }} (threshold: 90%).'

      - alert: CriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.95
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Critical memory usage on {{ $labels.instance }}'
          description: 'Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }} (threshold: 95%).'

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High CPU usage on {{ $labels.instance }}'
          description: 'CPU usage is above 80% for more than 10 minutes.'

      - alert: HighConnectionCount
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High database connection count'
          description: 'Database connection count is {{ $value }} (threshold: 100).'

      - alert: TlsCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'TLS certificate expiring soon on {{ $labels.instance }}'
          description: 'TLS certificate expires in {{ $value | humanizeDuration }}.'

      - alert: TemporalWorkflowBacklog
        expr: rate(temporal_workflow_started_total[10m]) > 0 and rate(temporal_workflow_completed_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Temporal workflow backlog — started but not completing'
          description: 'Workflows started but none completed for 15m on {{ $labels.task_queue }}.'

  - name: vaeloom-business-alerts
    interval: 60s
    rules:
      - alert: HighFailedJobRate
        expr: rate(job_failures_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High failed job rate'
          description: 'Job failure rate is {{ $value }}/s (threshold: 0.1/s).'

      - alert: ApiRateLimitExceeded
        expr: rate(rate_limit_exceeded_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Rate limit exceeded frequently'
          description: 'Rate limit exceeded {{ $value }} times in the last 5 minutes.'

  - name: vaeloom-temporal-alerts
    interval: 30s
    rules:
      - alert: TemporalWorkflowFailureSpike
        expr: rate(temporal_workflow_failed_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Temporal workflow failure spike'
          description: 'Workflow failures {{ $value }}/s for {{ $labels.workflow_type }} (threshold 0.05/s).'

      - alert: TemporalActivityFailureSpike
        expr: rate(temporal_activity_failed_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Temporal activity failure spike'
          description: 'Activity failures {{ $value }}/s for {{ $labels.activity_type }}.'

      - alert: TemporalActivityRetriesHigh
        expr: rate(temporal_activity_retried_total[5m]) > 0.2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High Temporal activity retries'
          description: 'Retries {{ $value }}/s for {{ $labels.activity_type }} — possible transient storm.'

      - alert: TemporalWorkerUnavailable
        expr: up{service="temporal-worker"} == 0 or up{service="temporal"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Temporal worker or server down'
          description: 'Temporal {{ $labels.service }} has been down for 5m.'

      - alert: TemporalScheduleFailure
        expr: rate(temporal_schedule_execution_total{status="failed"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Temporal schedule execution failed'
          description: 'Schedule {{ $labels.schedule_id }} failed.'

      - alert: TemporalHeartbeatTimeout
        expr: rate(temporal_activity_failed_total{reason="HeartbeatTimeout"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Temporal heartbeat timeout'
          description: 'Activity {{ $labels.activity_type }} heartbeat timeout.'

      - alert: TemporalWorkflowLatencyHigh
        expr: histogram_quantile(0.99, rate(temporal_workflow_duration_seconds_bucket[5m])) > 120
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'High Temporal workflow p99 latency'
          description: 'p99 workflow duration {{ $value }}s exceeds 120s.'
