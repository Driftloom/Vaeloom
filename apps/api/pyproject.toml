[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-api"
version = "0.2.0"
description = "Vaeloom Unified API - API Gateway + AI Service"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "anthropic>=0.34.0",
    "openai>=1.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "numpy>=1.26.0",
    "tenacity>=8.3.0",
    "pyjwt>=2.8.0",
    "alembic>=1.13.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-distro>=0.45b0",
    "opentelemetry-exporter-otlp>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "pgvector>=0.2.5",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "google-api-python-client>=2.130.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "signxml>=4.0.4",
    "croniter>=3.0.0",
    "starlette==0.50.0",
    "jinja2>=3.1.0",
    "playwright>=1.45.0",
    "mcp>=2.0.0",
    "temporalio>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Memory-friendly: 4 workers (each ~300MB, total ~1.2GB). -n auto (16) ≈ 4-5GB and can OOM on 16GB laptops.
# Use --dist loadfile only for large suites if you want file-level grouping; for 2-file small runs it can be slower.
addopts = "-n 4 --dist loadfile --timeout=120 --timeout-method=thread"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function-call-in-default-argument — intentional FastAPI Depends() pattern
    "ARG001",  # unused-function-argument — common in FastAPI route handlers / protocols
    "ARG002",  # unused-method-argument — common in FastAPI route handlers / protocols
    "B904",    # raise-without-from-inside-except — intentional exception translation (FastAPI HTTPException wrapping)
    "N815",    # mixed-case-variable-in-class-scope — existing naming, renaming breaks references
    "N818",    # error-suffix-on-exception-name — existing exception class names
    "N812",    # lowercase-imported-as-non-lowercase — existing import patterns
    "N803",    # invalid-argument-name — existing parameter names
    "N811",    # constant-imported-as-non-constant — existing patterns
    "SIM117",  # multiple-with-statements — minor style, not a bug
    "E701",    # multiple-statements-on-one-line-colon — minor style
    "E741",    # ambiguous-variable-name — existing variable names
    "SIM102",  # collapsible-if — minor style preference
    "B039",    # mutable-contextvar-default — intentional pattern
    "E402",    # module-import-not-at-top — intentional ordering
    "UP031",   # printf-string-formatting — existing code style
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["api"]
omit = ["tests/*", "alembic/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "email-validator>=2.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "freezegun>=1.4.0",
    "responses>=0.25.0",
    "pytest-xdist>=3.6.0",
]
