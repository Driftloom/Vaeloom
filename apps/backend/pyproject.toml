[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-backend"
version = "0.2.0"
description = "Vaeloom Unified Backend - API Gateway + AI Service"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "anthropic>=0.34.0",
    "openai>=1.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "numpy>=1.26.0",
    "tenacity>=8.3.0",
    "pyjwt>=2.8.0",
    "alembic>=1.13.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-distro>=0.45b0",
    "opentelemetry-exporter-otlp>=0.45b0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "pgvector>=0.2.5",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "google-api-python-client>=2.130.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "alembic/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "email-validator>=2.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "freezegun>=1.4.0",
    "responses>=0.25.0",
]
