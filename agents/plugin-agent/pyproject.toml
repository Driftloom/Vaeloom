[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-plugin-agent"
version = "1.0.0"
description = "Third-party community plugin orchestration and sandbox verification."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "vaeloom-agent-contracts",
    "vaeloom-agent-policy",
    "vaeloom-agent-common",
]

[tool.setuptools.packages.find]
where = ["src"]
