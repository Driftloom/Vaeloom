schema_version: 1.0.0
agent_id: security-agent
name: Security Agent
version: 1.0.0
description: Security log auditing, SSRF anomaly detection, and permission checks.
category: system
autonomy_level: full
tools:
  - search_documents
gated_tools: []
memory_scopes:
  read_scopes:
    - audit_logs
  write_scopes:
    - security_alerts
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
