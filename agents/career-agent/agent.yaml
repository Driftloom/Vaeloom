schema_version: 1.0.0
agent_id: career-agent
name: Career Agent
version: 1.0.0
description: Guide users on career paths, skill development, and trajectory planning.
category: career
autonomy_level: full
tools:
  - web_search
  - query_graph
  - search_documents
gated_tools: []
memory_scopes:
  read_scopes:
    - career_history
    - profile
  write_scopes:
    - career_notes
  denied_scopes: []
delegation:
  allowed_targets:
    - ats-agent
    - resume-agent
    - job-search-agent
  max_depth: 2
  can_delegate: true
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
