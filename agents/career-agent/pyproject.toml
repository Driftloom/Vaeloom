[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-career-agent"
version = "1.0.0"
description = "Guide users on career paths, skill development, and trajectory planning."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "vaeloom-agent-contracts",
    "vaeloom-agent-policy",
    "vaeloom-agent-common",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "src",
    "../../packages/agent-common/src",
    "../../packages/agent-policy/src",
    "../../packages/agent-security/src",
    "../../packages/agent-contracts/src",
]

