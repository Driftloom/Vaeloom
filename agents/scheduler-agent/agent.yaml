schema_version: 1.0.0
agent_id: scheduler-agent
name: Scheduler Agent
version: 1.0.0
description: Periodic background agent schedule coordination and cron management.
category: productivity
autonomy_level: approval_gated
tools:
  - notify_user
gated_tools: []
memory_scopes:
  read_scopes:
    - schedules
  write_scopes:
    - schedule_runs
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
