schema_version: 1.0.0
agent_id: qa-agent
name: QA Agent
version: 1.0.0
description: Output validation, ATS rubric scoring, and factual consistency verification.
category: system
autonomy_level: full
tools:
  - audit_ats_formatting
gated_tools: []
memory_scopes:
  read_scopes:
    - agent_outputs
  write_scopes:
    - qa_verdicts
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
