schema_version: 1.0.0
agent_id: organization-agent
name: Organization Agent
version: 1.0.0
description: File organization, document naming standard enforcement, and cleanup.
category: productivity
autonomy_level: approval_gated
tools:
  - rename_file
  - move_file
gated_tools:
  - rename_file
  - move_file
memory_scopes:
  read_scopes:
    - drive_index
  write_scopes:
    - drive_actions
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
