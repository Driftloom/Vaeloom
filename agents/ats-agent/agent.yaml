schema_version: 1.0.0
agent_id: ats-agent
name: ATS Agent
version: 1.0.0
description: ATS keyword matching, format auditing, and compatibility scoring.
category: career
autonomy_level: full
tools:
  - calculate_semantic_ats_score
  - extract_missing_hard_skills
  - audit_ats_formatting
gated_tools: []
memory_scopes:
  read_scopes:
    - resume_history
    - job_descriptions
  write_scopes:
    - ats_scores
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
