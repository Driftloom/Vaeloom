schema_version: 1.0.0
agent_id: research-agent
name: Research Agent
version: 1.0.0
description: Deep market intelligence, company compensation benchmarks, and industry
  news.
category: career
autonomy_level: full
tools:
  - web_search
  - scrape_company_insights
gated_tools: []
memory_scopes:
  read_scopes:
    - '*'
  write_scopes:
    - company_insights
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
