schema_version: 1.0.0
agent_id: job-search-agent
name: Job Search Agent
version: 1.0.0
description: Job board crawling, vacancy deduplication, and employer research.
category: career
autonomy_level: full
tools:
  - search_jobs
  - search_greenhouse_jobs
  - search_lever_jobs
  - browse_job_page
gated_tools: []
memory_scopes:
  read_scopes:
    - career_preferences
  write_scopes:
    - saved_jobs
  denied_scopes: []
delegation:
  allowed_targets:
    - application-agent
  max_depth: 2
  can_delegate: true
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
