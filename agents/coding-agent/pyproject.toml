[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaeloom-coding-agent"
version = "1.0.0"
description = "Algorithm design, code execution in sandbox, and coding interview prep."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "vaeloom-agent-contracts",
    "vaeloom-agent-policy",
    "vaeloom-agent-common",
]

[tool.setuptools.packages.find]
where = ["src"]
