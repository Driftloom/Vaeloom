schema_version: 1.0.0
agent_id: recommendation-agent
name: Recommendation Agent
version: 1.0.0
description: Personalized career move proposals and project recommendations.
category: career
autonomy_level: full
tools:
  - query_graph
  - search_documents
gated_tools: []
memory_scopes:
  read_scopes:
    - career_history
  write_scopes:
    - recommendations
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
