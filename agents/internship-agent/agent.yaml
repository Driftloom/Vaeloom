schema_version: 1.0.0
agent_id: internship-agent
name: Internship Agent
version: 1.0.0
description: Early-career and university internship search, timeline tracking.
category: career
autonomy_level: full
tools:
  - search_jobs
  - web_search
gated_tools: []
memory_scopes:
  read_scopes:
    - education_history
  write_scopes:
    - saved_internships
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
