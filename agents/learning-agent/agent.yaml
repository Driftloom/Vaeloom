schema_version: 1.0.0
agent_id: learning-agent
name: Learning Agent
version: 1.0.0
description: Curriculum recommendation, certification tracking, and course discovery.
category: career
autonomy_level: full
tools:
  - web_search
  - query_graph
gated_tools: []
memory_scopes:
  read_scopes:
    - skill_gaps
  write_scopes:
    - learning_plans
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
