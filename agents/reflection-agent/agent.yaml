schema_version: 1.0.0
agent_id: reflection-agent
name: Reflection Agent
version: 1.0.0
description: Post-execution memory reflection, preference extraction, and learning
  closure.
category: memory
autonomy_level: full
tools:
  - query_graph
  - search_documents
gated_tools: []
memory_scopes:
  read_scopes:
    - recent_episodes
  write_scopes:
    - consolidated_insights
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
