schema_version: 1.0.0
agent_id: memory-agent
name: Memory Agent
version: 1.0.0
description: Knowledge extraction, fact consolidation, and graph node creation.
category: memory
autonomy_level: approval_gated
tools:
  - create_entity
  - merge_entities
  - query_graph
gated_tools:
  - create_entity
  - merge_entities
memory_scopes:
  read_scopes:
    - '*'
  write_scopes:
    - knowledge_graph
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
