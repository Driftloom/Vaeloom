schema_version: 1.0.0
agent_id: calendar-agent
name: Calendar Agent
version: 1.0.0
description: Interview scheduling, event syncing, and calendar conflict resolution.
category: productivity
autonomy_level: approval_gated
tools:
  - list_calendar_events
  - create_calendar_event
gated_tools:
  - create_calendar_event
memory_scopes:
  read_scopes:
    - calendar_cache
  write_scopes:
    - calendar_events
  denied_scopes: []
delegation:
  allowed_targets: []
  max_depth: 0
  can_delegate: false
budget:
  max_tokens_per_turn: 8192
  max_steps_per_turn: 15
  max_usd_per_turn: 0.5
  timeout_seconds: 60
fallback:
  fallback_agent: null
  on_timeout: abort
  on_rate_limit: retry_exponential
