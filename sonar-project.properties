sonar.projectKey=vaeloom
sonar.projectName=Vaeloom
sonar.projectVersion=1.0.0

sonar.sources=apps/backend/src,apps/web/src,packages
sonar.tests=apps/backend/tests,apps/web/src/__tests__
sonar.test.inclusions=**/*test*,**/*Test*,**/__tests__/**

sonar.sourceEncoding=UTF-8
sonar.language=py,ts,tsx,js

sonar.python.coverage.reportPaths=apps/backend/coverage.xml
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

sonar.coverage.exclusions=\
  apps/backend/src/alembic/**/*,\
  apps/backend/src/backend/infrastructure/**/*,\
  apps/web/src/**/*.stories.*,\
  apps/web/src/**/*.spec.*,\
  packages/**/*.stories.*,\
  packages/**/*.spec.*

sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/__mutants__/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.pyc,\
  **/migrations/**,\
  **/alembic/**/*

sonar.python.version=3.12

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.verbose=false

sonar.host.url=http://localhost:9000
sonar.token=${env.SONAR_TOKEN}
