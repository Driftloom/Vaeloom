  /api/v1/agents/runs/{request_id}/cancel:
    post:
      tags:
        - agents
      summary: Cancel Run
      description: "Cooperative cancellation of an active agent run (\xA731).\n\n\
        Sets the durable cancel flag; the orchestrator loop (and any worker\ndriving\
        \ it) observes the flag before its next consequential step and\nterminates\
        \ as cancelled/user_cancel without further side effects.\nWorkspace binding\
        \ is verified twice (caller membership + checkpoint\nownership); unknown runs\
        \ return 404 to avoid enumeration."
      operationId: cancel_run_api_v1_agents_runs__request_id__cancel_post
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            title: Request Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRun'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/chat:
    post:
      tags:
        - agents
      summary: Chat
      description: 'High-level chat endpoint: auto-classifies intent, routes to the
