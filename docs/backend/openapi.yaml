paths:
  /api/v1/admin/agents/usage:
    get:
      operationId: get_agent_usage_api_v1_admin_agents_usage_get
      parameters:
        - description: Filter by agent name
          in: query
          name: agent_name
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by agent name
            title: Agent Name
        - description: Filter by workspace ID
          in: query
          name: workspace_id
          required: false
          schema:
            anyOf:
              - type: string
              - type: 'null'
            description: Filter by workspace ID
            title: Workspace Id
        - description: Time period in hours
          in: query
          name: period_hours
          required: false
          schema:
            anyOf:
              - type: integer
              - type: 'null'
            description: Time period in hours
            title: Period Hours
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
