    get:
      tags:
        - security
      summary: Get Csrf Token
      operationId: get_csrf_token_csrf_token_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '429': &id001
          description: Too Many Requests — rate limit exceeded (sliding window). See
            docs/backend/Rate-Limiting.md. Retry after the seconds given in the `Retry-After`
            header.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Limit:
              description: Configured request quota for the window.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix timestamp when the window resets.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                required:
                  - detail
              example:
                detail: Rate limit exceeded
