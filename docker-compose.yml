version: '3.9'

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

x-service-base: &service-base
  networks:
    - vaeloom-net
  logging: *default-logging
  restart: unless-stopped

networks:
  vaeloom-net:
    name: vaeloom-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  minio-data:
  temporal-db-data:
  temporal-visibility-data:

services:
  # ─── Infrastructure ───
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vaeloom-postgres
    environment:
      POSTGRES_DB: vaeloom
      POSTGRES_USER: vaeloom
      POSTGRES_PASSWORD: vaeloom_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaeloom']
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *service-base

  redis:
    image: redis:7-alpine
    container_name: vaeloom-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    <<: *service-base

  # ─── Frontend ───
  web:
    build: ./apps/web
    container_name: vaeloom-web
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - api
    <<: *service-base

  # ─── Unified API (FastAPI) ───
  api:
    build: ./apps/api
    container_name: vaeloom-api
    environment:
      SERVICE_NAME: vaeloom-api
      SERVICE_VERSION: '0.2.0'
      SERVICE_ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE__URL: postgresql+asyncpg://vaeloom:vaeloom_dev@postgres:5432/vaeloom
      REDIS__URL: redis://redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_REQUESTS: '5000'
      RATE_LIMIT_WINDOW: '60'
      JWT_SECRET: dev-jwt-secret-not-for-production
      JWT_ALGORITHM: HS256
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: vaeloom
      STORAGE_SECRET_KEY: vaeloom_dev_minio
      STORAGE_BUCKET: vaeloom-storage
      STORAGE_REGION: us-east-1
      TEMPORAL_ENABLED: '${TEMPORAL_ENABLED:-false}'
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      LANGGRAPH_ENABLED: '${LANGGRAPH_ENABLED:-false}'
      LANGGRAPH_VERSION: 'v1'
      LANGGRAPH_SHADOW_MODE: '${LANGGRAPH_SHADOW_MODE:-false}'
      LANGGRAPH_AGENT_RUN_PERCENT: '${LANGGRAPH_AGENT_RUN_PERCENT:-0}'
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *service-base

  # ─── Durable queue worker (schedules + events, ADR-033) ───
  queue-worker:
    build: ./apps/api
    container_name: vaeloom-queue-worker
    command: ['python', '-m', 'api.workers.queue_worker']
    environment:
      SERVICE_NAME: vaeloom-queue-worker
      SERVICE_VERSION: '0.2.0'
      SERVICE_ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE__URL: postgresql+asyncpg://vaeloom:vaeloom_dev@postgres:5432/vaeloom
      REDIS__URL: redis://redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_REQUESTS: '5000'
      JWT_SECRET: dev-jwt-secret-not-for-production
      JWT_ALGORITHM: HS256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *service-base

  # ─── MinIO (S3-compatible object storage) ───
  minio:
    image: quay.io/minio/minio:latest
    container_name: vaeloom-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: vaeloom
      MINIO_ROOT_PASSWORD: vaeloom_dev_minio
      MINIO_DOMAIN: minio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *service-base

  # ─── Connection Pooler ───
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vaeloom-pgbouncer
    environment:
      DB_USER: vaeloom
      DB_PASSWORD: vaeloom_dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vaeloom
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      MAX_CLIENT_CONN: 200
      SERVER_IDLE_TIMEOUT: 300
    ports:
      - '6432:6432'
    depends_on:
      - postgres
    <<: *service-base

  # ─── Temporal durable execution (ADR-038) — opt-in via profile `temporal` ───
  temporal-db:
    image: postgres:16-alpine
    container_name: vaeloom-temporal-db
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
      - ./infra/temporal/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ['temporal']
    <<: *service-base

  temporal-visibility-db:
    image: postgres:16-alpine
    container_name: vaeloom-temporal-visibility
    environment:
      POSTGRES_DB: temporal_visibility
      POSTGRES_USER: temporal_visibility
      POSTGRES_PASSWORD: temporal_visibility
    volumes:
      - temporal-visibility-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal_visibility']
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ['temporal']
    <<: *service-base

  temporal:
    image: temporalio/auto-setup:1.26
    container_name: vaeloom-temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      VISIBILITY_DB: postgres12
      VISIBILITY_POSTGRES_USER: temporal_visibility
      VISIBILITY_POSTGRES_PWD: temporal_visibility
      VISIBILITY_SEEDS: temporal-visibility-db
      DYNAMIC_CONFIG_VALUE: frontend.enableClientVersionCheck.enabled=false
    ports:
      - '7233:7233'
      - '8233:8233'
    depends_on:
      temporal-db:
        condition: service_healthy
      temporal-visibility-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'tctl --address temporal:7233 namespace list || temporal operator namespace list',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ['temporal']
    <<: *service-base

  temporal-ui:
    image: temporalio/ui:latest
    container_name: vaeloom-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:8234
    ports:
      - '8234:8080'
    depends_on:
      temporal:
        condition: service_healthy
    profiles: ['temporal']
    <<: *service-base

  temporal-worker:
    build: ./apps/api
    container_name: vaeloom-temporal-worker
    command: ['python', '-m', 'api.temporal.worker']
    environment:
      SERVICE_NAME: vaeloom-temporal-worker
      SERVICE_VERSION: '0.2.0'
      SERVICE_ENVIRONMENT: development
      DATABASE__URL: postgresql+asyncpg://vaeloom:vaeloom_dev@postgres:5432/vaeloom
      REDIS__URL: redis://redis:6379/0
      RATE_LIMIT_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_REQUESTS: '5000'
      TEMPORAL_ENABLED: 'true'
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      LANGGRAPH_ENABLED: '${LANGGRAPH_ENABLED:-false}'
      LANGGRAPH_VERSION: 'v1'
      LANGGRAPH_SHADOW_MODE: '${LANGGRAPH_SHADOW_MODE:-false}'
      LANGGRAPH_AGENT_RUN_PERCENT: '${LANGGRAPH_AGENT_RUN_PERCENT:-0}'
      JWT_SECRET: dev-jwt-secret-not-for-production
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    profiles: ['temporal']
    <<: *service-base

  # ─── Tools (opt-in via profiles) ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vaeloom-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vaeloom.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools
    <<: *service-base
