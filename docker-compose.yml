version: '3.9'

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

x-service-base: &service-base
  networks:
    - vaeloom-net
  logging: *default-logging
  restart: unless-stopped

networks:
  vaeloom-net:
    name: vaeloom-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  minio-data:

services:
  # ─── Infrastructure ───
  postgres:
    build:
      context: ./infra/docker/postgres
      dockerfile: Dockerfile
    container_name: vaeloom-postgres
    environment:
      POSTGRES_DB: vaeloom
      POSTGRES_USER: vaeloom
      POSTGRES_PASSWORD: vaeloom_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vaeloom']
      interval: 5s
      timeout: 5s
      retries: 5
    <<: *service-base

  redis:
    image: redis:7-alpine
    container_name: vaeloom-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    <<: *service-base

  # ─── Frontend ───
  web:
    build: ./apps/web
    container_name: vaeloom-web
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - api
    <<: *service-base

  # ─── Unified API (FastAPI) ───
  api:
    build: ./apps/api
    container_name: vaeloom-api
    environment:
      SERVICE_NAME: vaeloom-api
      SERVICE_VERSION: '0.2.0'
      SERVICE_ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      DATABASE__URL: postgresql+asyncpg://vaeloom:vaeloom_dev@postgres:5432/vaeloom
      REDIS__URL: redis://redis:6379/0
      JWT_SECRET: dev-jwt-secret-not-for-production
      JWT_ALGORITHM: HS256
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: vaeloom
      STORAGE_SECRET_KEY: vaeloom_dev_minio
      STORAGE_BUCKET: vaeloom-storage
      STORAGE_REGION: us-east-1
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *service-base

  # ─── MinIO (S3-compatible object storage) ───
  minio:
    image: quay.io/minio/minio:latest
    container_name: vaeloom-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: vaeloom
      MINIO_ROOT_PASSWORD: vaeloom_dev_minio
      MINIO_DOMAIN: minio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *service-base

  # ─── Connection Pooler ───
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: vaeloom-pgbouncer
    environment:
      DB_USER: vaeloom
      DB_PASSWORD: vaeloom_dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vaeloom
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      MAX_CLIENT_CONN: 200
      SERVER_IDLE_TIMEOUT: 300
    ports:
      - '6432:6432'
    depends_on:
      - postgres
    <<: *service-base

  # ─── Tools (opt-in via profiles) ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vaeloom-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vaeloom.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools
    <<: *service-base
